services:
  postgres:
    image: postgres:16-alpine
    container_name: email_agent_db
    environment:
      POSTGRES_USER: emailagent
      POSTGRES_PASSWORD: emailagent
      POSTGRES_DB: email_agent
    ports:
      - "5432:5432"
    volumes:
      - email_agent_pg:/var/lib/postgresql/data

volumes:
  email_agent_pg:
